<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Resonant Studios — Portal</title>
  <link rel="stylesheet" href="../../colors_and_type.css?v=c1">
  <script src="https://unpkg.com/lucide@0.462.0"></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--font-body); color: var(--ink); }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 30;
      background-image: url('../../assets/paper-grain.svg');
      background-size: 320px; opacity: 0.04; mix-blend-mode: screen;
    }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .main { padding: 28px 40px 64px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="NextSession.jsx"></script>
  <script type="text/babel" src="GoalsCard.jsx"></script>
  <script type="text/babel" src="SongProject.jsx"></script>
  <script type="text/babel" src="UpcomingList.jsx"></script>
  <script type="text/babel" src="MessagesPanel.jsx"></script>
  <script type="text/babel">
    function App() {
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return (
        <div className="layout" data-screen-label="01 Portal overview">
          <Sidebar />
          <div className="main">
            <div className="topbar">
              <div>
                <div style={{ color: 'var(--copper)', fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 600 }}>Good morning</div>
                <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 34, fontWeight: 500, letterSpacing: '-0.02em', margin: '4px 0 0', whiteSpace: 'nowrap' }}>Hi Sam.</h1>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
                <button className="btn btn-secondary" style={{ padding: '9px 14px', fontSize: 13, whiteSpace: 'nowrap' }}>
                  <i data-lucide="download" style={{ width: 15, height: 15, strokeWidth: 1.5, marginRight: 6 }}></i>
                  Download plan report
                </button>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 20, alignItems: 'flex-start' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <NextSession />
                <SongProject />
                <UpcomingList />
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <GoalsCard />
                <MessagesPanel />
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
