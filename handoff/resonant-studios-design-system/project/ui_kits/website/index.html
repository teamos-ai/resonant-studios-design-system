<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Resonant Studios</title>
  <link rel="stylesheet" href="../../colors_and_type.css?v=c1">
  <script src="https://unpkg.com/lucide@0.462.0"></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--paper); }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 30;
      background-image: url('../../assets/paper-grain.svg');
      background-size: 320px; opacity: 0.04; mix-blend-mode: screen;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="HowItWorks.jsx"></script>
  <script type="text/babel" src="Journey.jsx"></script>
  <script type="text/babel" src="NdisBlock.jsx"></script>
  <script type="text/babel" src="Story.jsx"></script>
  <script type="text/babel" src="CtaBand.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel">
    function App() {
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return (
        <div data-screen-label="01 Marketing home">
          <Nav />
          <Hero />
          <HowItWorks />
          <Journey />
          <NdisBlock />
          <Story />
          <CtaBand />
          <Footer />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
