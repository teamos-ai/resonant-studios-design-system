<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css?v=c4">
<link rel="stylesheet" href="_preview.css">
</head><body><div class="pv">
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;">
    <div style="background: var(--oat); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; box-shadow: var(--shadow-xs); min-height: 100px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-family: var(--font-display); font-size: 16px;">xs</div>
      <div style="font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 10px; color: var(--ink-soft);">shadow-xs · rest</div>
    </div>
    <div style="background: var(--oat); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; box-shadow: var(--shadow-sm); min-height: 100px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-family: var(--font-display); font-size: 16px;">sm</div>
      <div style="font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 10px; color: var(--ink-soft);">shadow-sm · card</div>
    </div>
    <div style="background: var(--oat); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; box-shadow: var(--shadow-md); min-height: 100px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-family: var(--font-display); font-size: 16px;">md</div>
      <div style="font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 10px; color: var(--ink-soft);">shadow-md · hover</div>
    </div>
    <div style="background: var(--oat); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; box-shadow: var(--shadow-lg); min-height: 100px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-family: var(--font-display); font-size: 16px;">lg</div>
      <div style="font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 10px; color: var(--ink-soft);">shadow-lg · modal</div>
    </div>
  </div>
  <div style="margin-top: 14px; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em;">Shadows are warm‑tinted (charcoal, low alpha) — never grey or black.</div>
</div></body></html>
