<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css?v=c4">
<link rel="stylesheet" href="_preview.css">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.01em; }
  .field .hint { font-size: 12px; color: var(--ink-muted); }
  .input { display: block; width: 100%; background: var(--oat); border: 1px solid var(--rule-strong); border-radius: 10px; padding: 11px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); box-sizing: border-box; transition: all 140ms var(--ease); }
  .input::placeholder { color: var(--ink-soft); }
  .input:focus { outline: none; border-color: var(--plum); box-shadow: 0 0 0 3px var(--plum-wash); }
  .input.err { border-color: var(--error); }
  .input.err:focus { box-shadow: 0 0 0 3px var(--error-wash); }
</style>
</head><body><div class="pv">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
    <div class="field">
      <label>Participant name</label>
      <input class="input" placeholder="E.g. Priya Saldana">
      <div class="hint">First and last name.</div>
    </div>
    <div class="field">
      <label>Email</label>
      <input class="input" value="jess@resonant.studio">
      <div class="hint">We'll send session reminders here.</div>
    </div>
    <div class="field">
      <label>NDIS participant number</label>
      <input class="input err" value="431 20">
      <div class="hint" style="color: var(--error);">This number should be 10 digits.</div>
    </div>
    <div class="field">
      <label>Plan management</label>
      <select class="input"><option>Plan‑managed</option><option>Self‑managed</option></select>
    </div>
  </div>
</div></body></html>
