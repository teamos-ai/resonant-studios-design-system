<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css?v=c4">
<link rel="stylesheet" href="_preview.css">
<style>
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 10px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: background 180ms var(--ease), transform 120ms var(--ease), border-color 180ms var(--ease);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .btn:active { transform: scale(0.985); }

  /* PRIMARY — copper-deep, black ink */
  .btn.primary   { background: var(--primary); color: var(--primary-ink); }
  .btn.primary:hover   { background: var(--primary-hover); }

  /* SECONDARY — sage-deep, black ink */
  .btn.secondary { background: var(--secondary); color: var(--secondary-ink); }
  .btn.secondary:hover { background: var(--secondary-hover); }

  /* Outline — linen outline (tertiary affordance) */
  .btn.outline { background: transparent; color: var(--ink); border-color: var(--ink); box-shadow: none; }
  .btn.outline:hover { background: rgba(35, 31, 26, 0.04); }

  /* Ghost — primary ink text, transparent */
  .btn.ghost { background: transparent; color: var(--primary-soft); box-shadow: none; }
  .btn.ghost:hover { background: var(--primary-wash); }

  .btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
  .btn.lg { padding: 14px 22px; font-size: 15px; border-radius: 12px; }
  .btn.dis { opacity: 0.4; pointer-events: none; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .lbl { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--primary-soft); font-weight: 700; margin-bottom: 8px; }

  .contrast-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;
    padding: 10px 12px; background: var(--oat); border-radius: 10px; border: 1px solid var(--rule);
  }
  .chip {
    font-family: var(--font-body); font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.02em; padding: 4px 9px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--rule); color: var(--ink-muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,0.2); }
  .chip .val { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip[data-grade="AAA"] .grade { color: var(--success); font-weight: 700; }
  .chip[data-grade="AA"] .grade { color: var(--success); font-weight: 600; }
</style>
</head><body><div class="pv">

  <div class="lbl">Primary (copper-deep) + secondary (sage-deep) · the two CTAs 95% of the time</div>
  <div class="row">
    <button class="btn primary">Book a call</button>
    <button class="btn secondary">Learn more</button>
    <button class="btn primary lg">Start your 8 sessions</button>
  </div>

  <div class="lbl">Paired in context · primary leads, secondary supports</div>
  <div class="row">
    <button class="btn primary">Join session</button>
    <button class="btn secondary">Reschedule</button>
    <button class="btn outline">Notes</button>
  </div>

  <div class="lbl">Ghost · inside cards, tertiary actions</div>
  <div class="row">
    <button class="btn ghost">View details →</button>
    <button class="btn ghost sm">See all songs</button>
    <button class="btn ghost dis">Disabled</button>
  </div>

  <div class="lbl">Sizes</div>
  <div class="row">
    <button class="btn primary sm">Small · 13/8px</button>
    <button class="btn primary">Default · 14/11px</button>
    <button class="btn primary lg">Large · 15/14px</button>
  </div>

  <div class="contrast-row" id="contrastRow">
    <span class="chip" data-fg="#000000" data-bg="#F2B98C"><span class="sw" style="background:#F2B98C"></span>Black on primary (copper-deep) · <span class="val"></span> <span class="grade"></span></span>
    <span class="chip" data-fg="#000000" data-bg="#CCDDD0"><span class="sw" style="background:#CCDDD0"></span>Black on secondary (sage-deep) · <span class="val"></span> <span class="grade"></span></span>
    <span class="chip" data-fg="#231F1A" data-bg="#FBF7EE"><span class="sw" style="background:#FBF7EE;border-color:#ccc"></span>Ink on paper (outline btn) · <span class="val"></span> <span class="grade"></span></span>
    <span class="chip" data-fg="#B87A4E" data-bg="#FBF7EE"><span class="sw" style="background:#FBF7EE;border-color:#ccc"></span>Ghost copper on paper · <span class="val"></span> <span class="grade"></span></span>
  </div>
</div>

<script>
(function(){
  function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function lum(r,g,b){const s=[r,g,b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*s[0]+0.7152*s[1]+0.0722*s[2];}
  function ratio(fg,bg){const a=lum(...hexToRgb(fg))+0.05,b=lum(...hexToRgb(bg))+0.05;return (Math.max(a,b)/Math.min(a,b));}
  document.querySelectorAll('.chip').forEach(c=>{
    const r=ratio(c.dataset.fg,c.dataset.bg);
    c.querySelector('.val').textContent=r.toFixed(2)+':1';
    let g=r>=7?'AAA':r>=4.5?'AA':r>=3?'AA-lg':'FAIL';
    c.querySelector('.grade').textContent=g;
    c.dataset.grade=g;
  });
})();
</script>
</body></html>
