<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../colors_and_type.css?v=c4">
<link rel="stylesheet" href="_preview.css">
<style>
  .dot { width: 14px; height: 14px; border-radius: 7px; background: var(--copper); position: absolute; top: 50%; transform: translateY(-50%); }
  .track { position: relative; height: 40px; background: var(--oat); border-radius: 20px; border: 1px solid var(--rule); overflow: hidden; }
  @keyframes slide { 0%,10% { left: 8px; } 60%, 100% { left: calc(100% - 22px); } }
  .d1 { animation: slide 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .d2 { animation: slide 2.4s cubic-bezier(0.32, 0.72, 0.24, 1) infinite; }
  .d3 { animation: slide 2.4s linear infinite; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .lbl .n { font-family: var(--font-display); font-size: 15px; }
  .lbl .d { font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; }
</style>
</head><body><div class="pv">
  <div class="lbl"><span class="n">House easing · out‑expo</span><span class="d">cubic-bezier(0.22, 1, 0.36, 1)</span></div>
  <div class="track"><div class="dot d1"></div></div>
  <div style="height: 10px;"></div>
  <div class="lbl"><span class="n">Soft — micro interactions</span><span class="d">cubic-bezier(0.32, 0.72, 0.24, 1)</span></div>
  <div class="track"><div class="dot d2"></div></div>
  <div style="height: 10px;"></div>
  <div class="lbl"><span class="n">Linear — avoid</span><span class="d">don't use</span></div>
  <div class="track" style="opacity: 0.6;"><div class="dot d3" style="background: var(--ink-soft);"></div></div>
  <div style="display: flex; gap: 20px; margin-top: 14px; font-size: 12px; color: var(--ink-muted);">
    <span><strong style="color: var(--ink);">140ms</strong> micro</span>
    <span><strong style="color: var(--ink);">220ms</strong> component</span>
    <span><strong style="color: var(--ink);">420ms</strong> scene</span>
    <span style="color: var(--ink-soft);">· no bounces, no springs</span>
  </div>
</div></body></html>
