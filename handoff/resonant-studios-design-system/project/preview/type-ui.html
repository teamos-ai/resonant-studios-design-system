<!doctype html>
<html><head><meta charset="utf-8"><title>UI type & labels</title>
<link rel="stylesheet" href="../colors_and_type.css?v=c4">
<link rel="stylesheet" href="_preview.css">
</head><body><div class="pv">
  <div style="display: grid; grid-template-columns: 120px 1fr; column-gap: 18px; row-gap: 14px; align-items: center;">
    <div style="color: var(--ink-soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;">Button</div>
    <div style="font-family: var(--font-body); font-size: 16px; font-weight: 500; color: var(--ink);">Book an intro call</div>

    <div style="color: var(--ink-soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;">Label</div>
    <div style="font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.01em;">Participant name</div>

    <div style="color: var(--ink-soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;">Helper</div>
    <div style="font-family: var(--font-body); font-size: 13px; color: var(--ink-muted);">We'll only use this to send session reminders.</div>

    <div style="color: var(--ink-soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;">Caption</div>
    <div style="font-family: var(--font-body); font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em;">Session 4 of 8 · Recorded 14 March</div>

    <div style="color: var(--ink-soft); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;">Numerals</div>
    <div><code style="font-family: var(--font-body); font-variant-numeric: tabular-nums; font-size: 13px; background: var(--oat); padding: 3px 8px; border-radius: 6px; color: var(--ink-2); font-weight: 500;">RS‑2026‑0418</code></div>
  </div>
</div></body></html>
